name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --frozen resolves from the committed lockfile. That matters because
      # [tool.uv] exclude-newer is a rolling 7-day window: re-resolving here
      # would drift from what was locked.
      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      # Tests needing a real qna, Docker, sshd, or the network are marked and
      # auto-skip here (see tests/conftest.py).
      - name: Test
        run: uv run pytest -q -rs
