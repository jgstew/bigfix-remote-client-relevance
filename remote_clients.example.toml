# Example inventory for --inventory remote_clients.toml, or an
# auto-discovered one -- see README.md#inventory. With no target given at
# all, this file is searched for in three places, current directory first:
#   1. ./remote_clients.toml
#   2. ~/.bigfix/remote_clients.toml           (per-user)
#   3. the platform's all-users config dir     (e.g. /etc/xdg/bigfix on
#      Linux, /Library/Application Support/bigfix on macOS,
#      C:\ProgramData\bigfix on Windows)
# `.bigfix` and the all-users "bigfix" directory are deliberately shared,
# cross-project names -- other BigFix tools can drop their own config there
# too, not just this one.
#
# [defaults] applies to every [hosts.*] table below; any key repeated on a
# host wins over the default for that host only.

[defaults]
qna_version = "11.0"        # version spec; overridable per host

[hosts.this-computer]
transport = "local"
qna_version = []            # empty list, not a string: opts this host out of
                             # [defaults] and probes whatever's installed
                             # instead of pinning to "11.0"

# [hosts."10.0.0.0"]           # dotted/numeric table names must be quoted --
# transport = "ssh"            # unquoted, TOML reads 10.0.0.0 as nested keys
# user = "jgstew"

# [hosts."mac.local"]
# transport = "ssh"
# user = "jgstew"

[hosts.ubuntu-2404]
transport = "container"
image = "ubuntu:24.04"

[hosts.debian-12]
transport = "container"
image = "debian:12"

[hosts.almalinux-9]
transport = "container"
image = "almalinux:9"

[hosts.amazonlinux-2023]
transport = "container"
image = "amazonlinux:2023"

[hosts.oraclelinux-9]
transport = "container"
image = "oraclelinux:9"

[hosts.ubi9]
transport = "container"
image = "registry.access.redhat.com/ubi9/ubi"

[hosts.opensuse-leap-15]
transport = "container"
image = "opensuse/leap:15"

# `keep_alive` reuses one container across a batch of expressions rather than
# starting one per expression; it is stopped when the run finishes. Every
# container also removes itself after `idle_ttl_s` seconds idle (default 120)
# as a backstop, for the case where a run is killed before it can clean up.
[hosts.ubuntu-24-04-batch]
transport = "container"
image = "ubuntu:24.04"
keep_alive = true
idle_ttl_s = 300
