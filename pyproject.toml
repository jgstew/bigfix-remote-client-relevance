[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bigfix-remote-client-relevance"
description = "Evaluate BigFix client relevance on remote endpoints and inside containers via qna, without a full BES install."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "James Stewart" }]
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["bigfix", "qna", "client-relevance", "ssh", "docker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "asyncssh>=2.14",
  "docker>=7.0",
  "typer>=0.12",
]

# Dev tooling lives in a PEP 735 dependency group, which `uv sync` installs by
# default — an optional-dependencies extra would need `--extra dev` every time.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
bigfix-remote-client-relevance = "bigfix_remote_client_relevance.cli:main"

[project.urls]
Homepage = "https://github.com/jgstew/bigfix_remote_client_relevance"
Issues   = "https://github.com/jgstew/bigfix_remote_client_relevance/issues"
Source   = "https://github.com/jgstew/bigfix_remote_client_relevance"

# --- Build backend ---------------------------------------------------------

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/bigfix_remote_client_relevance"]

# --- uv --------------------------------------------------------------------

[tool.uv]
# Prefer uv-managed CPython so `uv sync` / `uv run` transparently fetch the
# right interpreter (see .python-version) rather than depending on the
# system's Python being present.
python-preference = "managed"

# Supply-chain quarantine: ignore any distribution uploaded in the last 7
# days, so a compromised or broken release is not picked up during the
# window in which such uploads are typically caught and yanked. Rolling and
# relative — evaluated at resolution time, recorded in uv.lock as
# `exclude-newer-span`. Overridable per run (`--exclude-newer`) or per
# package (`--exclude-newer-package`) when a fresh release must be taken
# early; see DESIGN.md § Packaging & Python versions.
exclude-newer = "-P7D"

# --- Tooling ---------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Everything unmarked runs offline on a bare machine. Marked tests need a real
# prerequisite and are auto-skipped by tests/conftest.py when it is absent.
markers = [
  "live_qna: needs a real local qna binary (root on macOS: sudo -E uv run pytest -m live_qna)",
  "docker: needs a reachable Docker daemon",
  "ssh_localhost: needs sshd on localhost with key auth for the current user",
  "network: reaches support.bigfix.com / software.bigfix.com (opt in with BFRCR_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# T20 (flake8-print) enforces the project-wide "logging, never print" rule:
# stdout is reserved for the CLI's result payload and, later, the stdio MCP
# server's JSON-RPC stream. See DESIGN.md § Output convention.
extend-select = ["T20"]

[tool.ruff.lint.per-file-ignores]
# cli.py is the single sanctioned stdout writer.
"src/bigfix_remote_client_relevance/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
